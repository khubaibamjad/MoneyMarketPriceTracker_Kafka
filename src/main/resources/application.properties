spring.application.name=StockMarketTracker

spring.datasource.url=jdbc:h2:mem:StockMarketTracker
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update


debug=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


spring.jpa.show-sql=true

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.StockMarketTracker.DTO.PriceEvent

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=stock-market-tracker
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.allow.auto.create.topics=false